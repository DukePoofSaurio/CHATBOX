<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universitaria de Colombia - {% block title %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="../static/css/estilos.css" rel="stylesheet">
  </head>
<body>
  <div class="estimgu">
    <img src="https://universitariadecolombia.edu.co/wp-content/uploads/2022/02/imagenlogop2.png" srcset="https://universitariadecolombia.edu.co/wp-content/uploads/2022/02/imagenlogop2.png 1x, https://universitariadecolombia.edu.co/wp-content/uploads/2022/02/imagenlogop2.png 2x" alt="Universitaria de Colombia Logo" data-retina_logo_url="https://universitariadecolombia.edu.co/wp-content/uploads/2022/02/imagenlogop2.png" class="fusion-standar-logo">
  </div>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="{{url_for('mision')}}">Misión</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{url_for('vision')}}">Visión</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{url_for('programas')}}">Programas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{url_for('listacarreras')}}">Carreras Disponibles</a>
      </li>
    </ul>
  </div>
</nav>

    {% block content%} {% endblock %}
    <div class="espacio"></div>
    <footer><a href="www.google.com">Visitenos en Internet</a></footer>
</body>
</html>
