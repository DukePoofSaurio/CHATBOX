{% extends 'base.html' %}

{% block title %} Lista de Programas {% endblock %}

{% block content %} 
    <h1>Listado Programas de Universitaria de Colombia</h1>    
    <br>

    <table>
        <thead>
            <tr>
                <th>Codigo</th>
                <th>Carrera</th>
            </tr>
        </thead>
        <tbody>
            {% for registro in carreras %}
                <tr>
                    <td>{{ registro.0 }}</td>
                    <td>{{ registro.1 }}</td>
                    <td><a href="/eliminar/{{registro.0}}">Eliminar</a></td>
                    <td><a href="/actualizar/{{registro.0}}">Actualizar</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock%}
